
<section class="relative">
  <!-- CONTENT -->
  <div class="relative max-w-7xl mx-auto px-4 py-12 md:py-20 grid lg:grid-cols-2 gap-10 items-center">

    <!-- LEFT SIDE -->
    <div class="text-black space-y-10">

      <h2 class="text-3xl md:text-4xl font-bold">
        Get in Touch
      </h2>

      <!-- TOP: CONTACT -->
      <div class="grid sm:grid-cols-2 gap-6">

        <!-- Phone -->
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-phone text-blue-600"></i>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-blue-600">Call Now</h3>
            <p class="text-sm text-gray-700">
              <a href="tel:9599127878" class="hover:underline">95991 27878</a><br>
              <a href="tel:9868726527" class="hover:underline">98687 26527</a>
            </p>
          </div>
        </div>

        <!-- Email -->
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-envelope text-blue-600"></i>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-blue-600">Email</h3>
            <p class="text-sm text-gray-700">
              enhancersacademy@gmail.com
            </p>
          </div>
        </div>

      </div>

      <!-- MIDDLE: BRANCHES -->
      <div class="grid sm:grid-cols-2 gap-6">

        <!-- Branch 1 -->
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-location-dot text-blue-600"></i>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-blue-600">Branch 1</h3>
            <p class="text-sm text-gray-700">
              F-10, Prashant Vihar
            </p>
          </div>
        </div>

        <!-- Branch 2 -->
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-location-dot text-blue-600"></i>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-blue-600">Branch 2</h3>
            <p class="text-sm text-gray-700">
              QU 233-C, Pitampura
            </p>
          </div>
        </div>

      </div>

      <!-- BOTTOM: MAPS -->
      <div class="grid sm:grid-cols-2 gap-6">

        <div class="rounded-xl overflow-hidden shadow-md hover:shadow-xl transition">
          <iframe src="https://maps.google.com/maps?q=Prashant%20Vihar%20Delhi&t=&z=15&ie=UTF8&iwloc=&output=embed"
            class="w-full h-[250px] border-0">
          </iframe>
        </div>

        <div class="rounded-xl overflow-hidden shadow-md hover:shadow-xl transition">
          <iframe src="https://maps.google.com/maps?q=Pitampura%20Delhi&t=&z=15&ie=UTF8&iwloc=&output=embed"
            class="w-full h-[250px] border-0">
          </iframe>
        </div>

      </div>

    </div>

    <!-- RIGHT SIDE FORM -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-2xl">

      <h2 class="text-2xl md:text-3xl font-bold mb-2 text-gray-800">
        Student Admission Enquiry
      </h2>

      <form class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- Student Name -->
        <input type="text" placeholder="Student Name"
          class="sm:col-span-2 border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2" />

        <!-- Class -->
        <select class="border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2">
          <option selected disabled>Select Class</option>
          <option>Class 1 – 8</option>
          <option>Class 9 – 10</option>
          <option>Class 11 – 12</option>
        </select>

        <!-- Subject -->
        <input type="text" placeholder="Subject"
          class="border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2" />

        <!-- Board -->
        <input type="text" placeholder="Board"
          class="border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2" />

        <!-- Student Phone -->
        <input type="tel" placeholder="Student Phone"
          class="border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2" />

        <!-- Parent Phone -->
        <input type="tel" placeholder="Parent Phone"
          class="sm:col-span-2 border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2" />

        <!-- Email -->
        <input type="email" placeholder="Email"
          class="sm:col-span-2 border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2" />

        <!-- Message -->
        <textarea rows="3" placeholder="Additional Message"
          class="sm:col-span-2 border-b-2 border-gray-300 focus:border-cyan-500 outline-none py-2"></textarea>

        <!-- Button -->
        <button class="sm:col-span-2 bg-cyan-500 text-white py-3 rounded-md font-semibold hover:bg-cyan-600 transition">
          Submit Enquiry
        </button>

      </form>

    </div>

  </div>

</section>
