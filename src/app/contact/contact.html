<!-- HERO -->
<section class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-16 text-center">
  <h1 class="text-4xl md:text-5xl font-bold mb-4">Contact Us</h1>
  <p class="text-lg opacity-90">We’d love to hear from you <i class="fa-solid fa-comments"></i></p>
</section>

<!-- CONTACT SECTION -->
<section class="py-12 bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-10">

    <!-- LEFT: FORM -->
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-lg">

  <h2 class="text-2xl font-bold mb-6 text-gray-800">
    Student Admission Enquiry
  </h2>

  <form class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Student Name -->
    <input type="text" placeholder="Student Name"
      class="col-span-2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

    <!-- Class -->
    <select class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <option selected disabled>Select Class</option>
      <option>Class 1 – 8</option>
      <option>Class 9 – 10</option>
      <option>Class 11 – 12</option>
    </select>

    <!-- Subject -->
    <input type="text" placeholder="Subject (Maths, Bio, Accounts...)"
      class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

    <!-- Board -->
    <input type="text" placeholder="Board (CBSE, ICSE, etc.)"
      class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

    <!-- Student Phone -->
    <input type="tel" placeholder="Student Phone Number"
      class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

    <!-- Parent Phone -->
    <input type="tel" placeholder="Parent Phone Number"
      class="col-span-2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

    <!-- Email -->
    <input type="email" placeholder="Email ID"
      class="col-span-2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

    <!-- Message -->
    <textarea rows="4" placeholder="Additional Message (Optional)"
      class="col-span-2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>

    <!-- Button -->
    <button
      class="col-span-2 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-semibold">
      Submit Enquiry
    </button>

  </form>

</div>

    <!-- RIGHT: CONTACT INFO -->
    <div class="space-y-6">

      <div class="bg-white p-6 rounded-2xl shadow">
        <h3 class="text-xl font-bold mb-4">Contact Information</h3>

        <p class="text-gray-600 mb-3"><i class="fa-solid fa-map-pin"></i> Gurgaon, Haryana</p>
        <p class="text-gray-600 mb-3"><i class="fa-solid fa-phone"></i> +91 9599127878</p>
        <p class="text-gray-600 mb-3"><i class="fa-solid fa-envelope"></i> enhancersacademy@gmail.com</p>
      </div>

      <!-- MAP -->
      <div class="rounded-2xl overflow-hidden shadow">
        <iframe 
          src="https://maps.google.com/maps?q=gurgaon&t=&z=13&ie=UTF8&iwloc=&output=embed"
          class="w-full h-[250px] border-0">
        </iframe>
      </div>

    </div>

  </div>
</section>
